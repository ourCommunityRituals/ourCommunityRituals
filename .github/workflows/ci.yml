# ourCommunityRituals root workspace CI.
#
# Runs on the self-hosted runner alongside OSE/OW/OCR-docs (same physical
# machine, same `self-hosted` label). This workspace hosts shared packages
# (packages/*) that bind Brain contracts to runtime code. Sibling app repos
# are gitignored here and have their own independent CI.
#
# Pipeline order honors the priority hierarchy (Quality > Security > Maintenance
# > Performance > Functionality) via Level-0 security gate first, then drift
# checks, then tests, then vision invariants.
#
# Trigger matrix:
#   | Event          | Gate | Invariants | Brain parity | Drift |
#   |----------------|------|------------|--------------|-------|
#   | PR → main      |  ✅  |     ✅     |      ✅      |  ✅   |
#   | Push to main   |  ✅  |     ✅     |      ✅      |  ✅   |
#   | Nightly        |  ✅  |     ✅     |      ✅      |  ✅   |
#   | Dispatch       |  ✅  |     ✅     |      ✅      |  ✅   |

name: OCR Workspace CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '17 3 * * *'  # Nightly 3:17 AM UTC — catches Brain drift between pushes
  workflow_dispatch:
    inputs:
      force_install:
        description: 'Force pnpm install (bust stamp)'
        type: boolean
        default: false

concurrency:
  group: ocr-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: 'Gate — L0 security + drift + tests'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1

      # Fetch the OCR-docs brain into the workspace so the L0 security gate, the
      # codegen drift check, and generate-from-yaml.mjs resolve
      # OCR-docs/ocr-docs-brain/flags-contract.yaml WITHOUT relying on a
      # manually-placed copy on the self-hosted runner. OCR-docs/ is gitignored.
      - name: Checkout OCR-docs brain
        uses: actions/checkout@v6
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: OCR-docs
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
          clean: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm version is pinned via package.json `packageManager`
          # (pnpm@9.15.0). Also setting `version:` here triggers
          # ERR_PNPM_BAD_PM_VERSION and fails the whole job.
          run_install: false

      # The L0 security gate runs `python3 tests/level0_security.py`. The
      # self-hosted BLOODRAVEN runners have no system Python on PATH (both
      # .env PATHs resolve `python3` to the Windows Store alias stub), so
      # provision Python via the action rather than relying on the host —
      # portable across runners and does not weaken the gate.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve pnpm store
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Compute the lockfile hash in-shell instead of via the built-in
      # hashFiles() expression. hashFiles enumerates the workspace root through
      # the runner's Node globber, which fails DETERMINISTICALLY on the
      # self-hosted BLOODRAVEN-2 host ("Fail to hash files under directory")
      # regardless of the glob pattern. sha256sum over the single root lockfile
      # is equivalent for cache-keying and sidesteps the broken enumeration.
      - name: Hash pnpm lockfile
        id: lockhash
        run: echo "HASH=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ steps.lockhash.outputs.HASH }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ "${{ inputs.force_install }}" = "true" ]; then
            pnpm install --frozen-lockfile=false
          else
            pnpm install --frozen-lockfile
          fi

      # ── Level 0: SECURITY (gate — blocks everything else on fail) ─────
      - name: 'L0 Security — @ocr/flags'
        run: pnpm flags:level0

      # ── Quality: generated-artifact drift (YAML → typed constants) ────
      - name: 'Drift — generated flag-keys + presets match Brain YAML'
        run: pnpm flags:check:generated

      # ── Quality: TypeScript typecheck ─────────────────────────────────
      - name: 'Quality — TypeScript'
        working-directory: packages/flags
        run: pnpm exec tsc -p tsconfig.json --noEmit

      # ── Quality: unit + adapter-spec + invariants ─────────────────────
      - name: 'Quality — vitest (adapter-spec × N adapters + invariants)'
        run: pnpm flags:test

  invariants:
    name: 'Vision invariants (Tier Equity / Inert Monetization / Deprecation Lock)'
    runs-on: self-hosted
    needs: [gate]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          # Version from package.json `packageManager`; see gate job above.
          run_install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: 'Run invariants suite only'
        working-directory: packages/flags
        run: pnpm exec vitest run tests/invariants.test.ts

  brain-parity:
    # Validates that the @ocr/flags contract (Brain YAML) still parses and
    # conforms to Brain's own pyramid levels 0-2. Requires OCR-docs to be
    # available as a sibling checkout (self-hosted runner has it; GitHub-
    # hosted runners would need a separate checkout step). Gracefully skips
    # if the sibling repo isn't present.
    name: 'Brain parity — flags-contract.yaml ↔ OCR-docs pyramid'
    runs-on: self-hosted
    needs: [gate]
    timeout-minutes: 5
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1

      # Self-contained: fetch the brain into THIS job's workspace (mirrors the
      # gate job) rather than trusting a manually-placed sibling checkout. The
      # old sibling probe (`$GITHUB_WORKSPACE/../OCR-docs`) never saw the gate's
      # in-workspace `OCR-docs/` checkout, so this job silently `exit 0`'d and
      # went green WITHOUT running the pyramid — a false-green (COST-201).
      - name: Checkout OCR-docs brain
        uses: actions/checkout@v6
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: OCR-docs
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
          clean: false
          fetch-depth: 1

      # Hard-fail if the brain is absent. This gate MUST NOT pass without
      # actually running — no silent-skip path remains.
      - name: Resolve brain dir (hard-fail if absent)
        id: brain
        run: |
          BRAIN_DIR="$GITHUB_WORKSPACE/OCR-docs/ocr-docs-brain"
          if [ ! -d "$BRAIN_DIR" ]; then
            echo "::error::OCR-docs brain not found at $BRAIN_DIR after checkout — the brain checkout is mandatory; this gate must not pass without running the pyramid."
            exit 1
          fi
          echo "BRAIN_DIR=$BRAIN_DIR" >> "$GITHUB_OUTPUT"

      - name: 'Run Brain pyramid L0-L2'
        working-directory: ${{ steps.brain.outputs.BRAIN_DIR }}
        run: py tests/run_all.py --level 2

  shared-gate-drift:
    # security_gate.py is vendored from OCR-docs/shared/ into every consumer
    # (tests/_shared/). This job verifies the vendored copy in packages/flags
    # matches the canonical. Drift = must run `py shared/sync_to_repos.py`
    # from OCR-docs before merging.
    name: 'Shared security_gate.py drift check'
    runs-on: self-hosted
    needs: [gate]
    timeout-minutes: 3
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1

      # Self-contained brain checkout (see brain-parity job). The old sibling
      # probe silently `exit 0`'d when `../OCR-docs` was absent, letting the
      # drift check pass without running — a false-green (COST-201).
      - name: Checkout OCR-docs brain
        uses: actions/checkout@v6
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: OCR-docs
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
          clean: false
          fetch-depth: 1

      # Hard-fail if the canonical is absent. This drift gate MUST NOT pass
      # without actually running the comparison.
      - name: Check drift vs OCR-docs canonical (hard-fail if absent)
        run: |
          CANONICAL="$GITHUB_WORKSPACE/OCR-docs"
          if [ ! -f "$CANONICAL/shared/check_drift.py" ]; then
            echo "::error::OCR-docs canonical not found at $CANONICAL/shared/check_drift.py after checkout — the drift check is mandatory; this gate must not pass without running."
            exit 1
          fi
          cd "$CANONICAL" && py shared/check_drift.py
