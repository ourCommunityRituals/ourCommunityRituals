# ourCommunityRituals root workspace CI.
#
# Runs on GitHub-hosted `ubuntu-latest` runners (migrated off the self-hosted
# BLOODRAVEN box — see EPIC OSE-953). These jobs are pure Node/pnpm/Python
# checks with no Windows or persistent-workspace coupling: they check out the
# Brain fresh via actions/checkout rather than reading a manually-placed sibling
# copy, so they ride ephemeral runners cleanly. This workspace hosts shared
# packages (packages/*) that bind Brain contracts to runtime code — the common
# foundation every spoke consumes. Sibling app repos are gitignored here and
# have their own independent CI (migrated per-repo under the same EPIC).
#
# Pipeline order honors the priority hierarchy (Quality > Security > Maintenance
# > Performance > Functionality) via Level-0 security gate first, then drift
# checks, then tests, then vision invariants.
#
# Trigger matrix:
#   | Event          | Gate | Invariants | Brain parity | Drift |
#   |----------------|------|------------|--------------|-------|
#   | PR → main      |  ✅  |     ✅     |      ✅      |  ✅   |
#   | Push to main   |  ✅  |     ✅     |      ✅      |  ✅   |
#   | Nightly        |  ✅  |     ✅     |      ✅      |  ✅   |
#   | Dispatch       |  ✅  |     ✅     |      ✅      |  ✅   |

name: OCR Workspace CI

on:
  # The PR trigger is intentionally UNfiltered by path. The gate / invariants /
  # brain-parity / shared-gate-drift jobs are REQUIRED status checks on main
  # (branch protection, enabled 2026-08-16). A path-filtered PR that skipped this
  # workflow would leave those required checks stuck "Expected — pending" and
  # block the PR forever (e.g. a docs-only PR). Running the gate on every PR
  # guarantees the required checks always report. `push` stays path-filtered
  # below: the PR already validated the change, so a post-merge re-run is
  # redundant, and the nightly cron still catches Brain drift between pushes.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '17 3 * * *'  # Nightly 3:17 AM UTC — catches Brain drift between pushes
  workflow_dispatch:
    inputs:
      force_install:
        description: 'Force pnpm install (bust stamp)'
        type: boolean
        default: false

concurrency:
  group: ocr-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: 'Gate — L0 security + drift + tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1

      # Repo / PR / Linear / runner context up front — legible on the verbose
      # self-hosted runner window and in the job summary.
      - name: Context banner
        uses: ./.github/actions/context-banner

      # Fetch the OCR-docs brain into the workspace so the L0 security gate, the
      # codegen drift check, and generate-from-yaml.mjs resolve
      # OCR-docs/ocr-docs-brain/flags-contract.yaml WITHOUT relying on a
      # manually-placed copy on the self-hosted runner. OCR-docs/ is gitignored.
      - name: Checkout OCR-docs brain
        uses: actions/checkout@v6
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: OCR-docs
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
          clean: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm version is pinned via package.json `packageManager`
          # (pnpm@9.15.0). Also setting `version:` here triggers
          # ERR_PNPM_BAD_PM_VERSION and fails the whole job.
          run_install: false

      # The L0 security gate runs `python3 tests/level0_security.py`. Provision
      # Python via the action (pinned 3.11) rather than relying on whatever the
      # host ships — portable across runners and does not weaken the gate.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve pnpm store
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Compute the lockfile hash in-shell (sha256sum over the single root
      # lockfile) rather than via hashFiles(). Equivalent for cache-keying and
      # kept portable/deterministic across runners; originally introduced to
      # sidestep a hashFiles enumeration failure on the self-hosted host.
      - name: Hash pnpm lockfile
        id: lockhash
        run: echo "HASH=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ steps.lockhash.outputs.HASH }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ "${{ inputs.force_install }}" = "true" ]; then
            pnpm install --frozen-lockfile=false
          else
            pnpm install --frozen-lockfile
          fi

      # ── Level 0: SECURITY (gate — blocks everything else on fail) ─────
      - name: 'L0 Security — @ocr/flags'
        run: pnpm flags:level0

      # ── Quality: generated-artifact drift (YAML → typed constants) ────
      - name: 'Drift — generated flag-keys + presets match Brain YAML'
        run: pnpm flags:check:generated

      # ── Quality: TypeScript typecheck ─────────────────────────────────
      - name: 'Quality — TypeScript'
        working-directory: packages/flags
        run: pnpm exec tsc -p tsconfig.json --noEmit

      # ── Quality: unit + adapter-spec (invariants excluded here — they run
      #    exactly once, authoritatively, in the dedicated `invariants` job
      #    below; COST-212 dedupe, gate keeps every other test) ────────────
      - name: 'Quality — vitest (adapter-spec × N adapters; invariants run in the dedicated job)'
        run: pnpm flags:test:gate

  invariants:
    name: 'Vision invariants (Tier Equity / Inert Monetization / Deprecation Lock)'
    runs-on: ubuntu-latest
    needs: [gate]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1
      - name: Context banner
        uses: ./.github/actions/context-banner
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          # Version from package.json `packageManager`; see gate job above.
          run_install: false

      # Share the pnpm store the gate job populated (COST-211). Same cache key
      # as the gate, so this install restores a warm, lockfile-keyed store
      # instead of a cold network install. --frozen-lockfile is retained below,
      # so store reuse NEVER skips the integrity check (kill-pass: reuse the
      # store, never weaken verification). Mirrors the gate job's cache steps.
      - name: Resolve pnpm store
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Hash pnpm lockfile
        id: lockhash
        run: echo "HASH=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ steps.lockhash.outputs.HASH }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: 'Run invariants suite only (authoritative — the single place invariants execute)'
        working-directory: packages/flags
        run: pnpm exec vitest run tests/invariants.test.ts

  brain-parity:
    # Validates that the @ocr/flags contract (Brain YAML) still parses and
    # conforms to Brain's own pyramid levels 0-2. Checks out OCR-docs fresh
    # into this job's workspace (below), so it is self-contained on the
    # ephemeral hosted runner — no reliance on a manually-placed sibling copy.
    name: 'Brain parity — flags-contract.yaml ↔ OCR-docs pyramid'
    runs-on: ubuntu-latest
    needs: [gate]
    timeout-minutes: 5
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1

      - name: Context banner
        uses: ./.github/actions/context-banner

      # Self-contained: fetch the brain into THIS job's workspace (mirrors the
      # gate job) rather than trusting a manually-placed sibling checkout. The
      # old sibling probe (`$GITHUB_WORKSPACE/../OCR-docs`) never saw the gate's
      # in-workspace `OCR-docs/` checkout, so this job silently `exit 0`'d and
      # went green WITHOUT running the pyramid — a false-green (COST-201).
      - name: Checkout OCR-docs brain
        uses: actions/checkout@v6
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: OCR-docs
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
          clean: false
          fetch-depth: 1

      # Brain pyramid is a Python test suite; provision Python on the hosted
      # runner (ubuntu ships python3, but pin the version for reproducibility).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Hard-fail if the brain is absent. This gate MUST NOT pass without
      # actually running — no silent-skip path remains.
      - name: Resolve brain dir (hard-fail if absent)
        id: brain
        run: |
          BRAIN_DIR="$GITHUB_WORKSPACE/OCR-docs/ocr-docs-brain"
          if [ ! -d "$BRAIN_DIR" ]; then
            echo "::error::OCR-docs brain not found at $BRAIN_DIR after checkout — the brain checkout is mandatory; this gate must not pass without running the pyramid."
            exit 1
          fi
          echo "BRAIN_DIR=$BRAIN_DIR" >> "$GITHUB_OUTPUT"

      # Bounded 2-attempt retry to close a fresh-checkout race: the pyramid can
      # exit in ~0.4s printing `FAIL Level 2 — SCHEMA` with NO test counts
      # (successful runs print `937 pass / 0 fail`) when the schema loader reads
      # the freshly written OCR-docs/ checkout before it settles — not a
      # test-code bug (the same SHA passes on re-run). Originally observed on the
      # Windows self-hosted runner; retained as a cheap guard on hosted runners.
      # A real regression still turns the job red because it must fail BOTH
      # in-step attempts; a fresh-checkout hiccup only fails the first.
      - name: 'Run Brain pyramid L0-L2'
        working-directory: ${{ steps.brain.outputs.BRAIN_DIR }}
        run: |
          set +e
          python3 tests/run_all.py --level 2
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::Brain pyramid failed on first attempt (rc=$rc) — retrying once to close the fresh-checkout race. A real regression will fail the retry too."
            sleep 2
            python3 tests/run_all.py --level 2
            rc=$?
          fi
          exit $rc

  shared-gate-drift:
    # security_gate.py is vendored from OCR-docs/shared/ into every consumer
    # (tests/_shared/). This job verifies the vendored copy in packages/flags
    # matches the canonical. Drift = must run `py shared/sync_to_repos.py`
    # from OCR-docs before merging.
    name: 'Shared security_gate.py drift check'
    runs-on: ubuntu-latest
    needs: [gate]
    timeout-minutes: 3
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1

      - name: Context banner
        uses: ./.github/actions/context-banner

      # Self-contained brain checkout (see brain-parity job). The old sibling
      # probe silently `exit 0`'d when `../OCR-docs` was absent, letting the
      # drift check pass without running — a false-green (COST-201).
      - name: Checkout OCR-docs brain
        uses: actions/checkout@v6
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: OCR-docs
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
          clean: false
          fetch-depth: 1

      # Drift check is a Python script; provision Python on the hosted runner.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Hard-fail if the canonical is absent. This drift gate MUST NOT pass
      # without actually running the comparison.
      - name: Check drift vs OCR-docs canonical (hard-fail if absent)
        run: |
          CANONICAL="$GITHUB_WORKSPACE/OCR-docs"
          if [ ! -f "$CANONICAL/shared/check_drift.py" ]; then
            echo "::error::OCR-docs canonical not found at $CANONICAL/shared/check_drift.py after checkout — the drift check is mandatory; this gate must not pass without running."
            exit 1
          fi
          cd "$CANONICAL" && python3 shared/check_drift.py
