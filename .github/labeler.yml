# Path-based PR labels for actions/labeler@v7 (read by .github/workflows/label.yml).
# The labeler runs on pull_request_target and reads this file from the base branch,
# so a change here takes effect for PRs opened after it lands on main.
# v5 and later need the `changed-files` form below; the v4 form (a bare list of
# globs under each label) is no longer read. This file and the action version in
# label.yml must change together.
docs:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'
packages:
  - changed-files:
      - any-glob-to-any-file: 'packages/**'
ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'
