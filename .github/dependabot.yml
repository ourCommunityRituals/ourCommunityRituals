# Keeps every pinned action current. Workflows pin actions by full commit SHA
# with the tag as a comment; Dependabot proposes the new SHA when the tag moves,
# so a pin changes only through a reviewed PR, never through a moved tag.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it, so a malicious or
    # broken release has time to be caught upstream (Semgrep
    # dependabot-missing-cooldown, blocking in the S0 bracket).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
