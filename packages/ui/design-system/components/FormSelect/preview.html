<div id="root" style="padding:24px"></div>
<script>
const { FormSelect } = window.OurSharedEvents;
const h = React.createElement;
function Demo(){ return h('div',{style:{display:'flex',flexDirection:'column',gap:16}},h(FormSelect,{id:'kind',label:'What kind of event is it?',hint:'Pick the closest — it sets the poster category colour.',options:[
 {value:'fair',label:'Street fair',selected:true},{value:'market',label:'Night market'},
 {value:'music',label:'Live music'},{value:'food',label:'Food drive'},{value:'clean',label:'Neighbourhood clean-up'}]})); }
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
