<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Belt hand-off and location choice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1A1918;color:#F4EEE2;-webkit-font-smoothing:antialiased}
a{color:#D4954B}a:hover{color:#E8A849}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #1A1918; color: #F4EEE2; display: flex; flex-direction: column; gap: 18px; padding: 24px 20px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #D4954B">Triple A Bocce Belt · new holder</span>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 800">The belt is yours. Where does it live now?</h1>
  </div>

  <div style="background: #232120; border: 1px solid #403D3A; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 16px; font-weight: 700">[NEW TEAM] beat [OLD TEAM]</span>
    <span style="font-size: 13px; color: #A39D94">[DATE] · at [CLUB NAME] · both captains confirmed</span>
  </div>

  <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
    <legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 700">Show people…</legend>
    <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 8px; margin: 0; color: #F4EEE2; border: {{o.edge}}; background: {{o.bg}}">
        <input type="radio" name="where" checked="{{o.checked}}" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #D4954B; flex-shrink: 0">
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 16px; font-weight: 700">{{o.title}}</span>
          <span style="font-size: 13px; line-height: 1.45; color: #A39D94">{{o.body}}</span>
          <span style="font-size: 13px; font-weight: 600; color: #F4EEE2">{{o.tag}}</span>
        </span>
      </label>
    </sc-for>
  </fieldset>

  <div style="border: 1px dashed #7E7871; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.45; color: #A39D94">You can change this whenever you like. Past stops in the history keep only the neighborhood, even if you shared an exact spot.</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="min-height: 52px; border: none; border-radius: 8px; background: #D4954B; color: #1A1918; font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Save and add to the history</button>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; color: #F4EEE2; margin: 0"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #D4954B; margin: 0">Show our team name as holder</label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var on = { edge: '2px solid #D4954B', bg: '#232120', checked: true };
    var off = { edge: '1px solid #7E7871', bg: 'transparent', checked: false };
    return { options: [
      Object.assign({ title: 'Our club\'s neighborhood', body: 'The resolution-7 cell around [CLUB NAME], about 5 km². This goes on the public map and in the history.', tag: 'Recommended · the default' }, on),
      Object.assign({ title: 'The exact spot, by link', body: 'A resolution-9 cell, about a block. Only people you send the link to can see it. It never appears on the public map, and you can turn the link off.', tag: 'You share it, you control it' }, off),
      Object.assign({ title: 'Just "in the league"', body: 'No place shown at all. The history records that the belt changed hands, and nothing about where.', tag: 'Most private' }, off)
    ] };
  }
}
</script>
</body>
</html>
