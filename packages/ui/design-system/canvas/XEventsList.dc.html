<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experiment: OSE events list on the ourSharedMosaics ground</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1A1918;color:#F4EEE2;-webkit-font-smoothing:antialiased}
a{color:#3D9BFF}a:hover{color:#8AC2FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1A1918; color: #F4EEE2; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 24px 20px 16px; text-align: center; border-bottom: 1px solid #403D3A; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #A39D94">OurSharedEvents</span>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800">Coming up near you</h1>
  </div>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #A39D94">Search by name or venue
      <input type="search" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #7E7871; background: #232120; color: #F4EEE2; font: inherit; font-size: 16px; font-weight: 400">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button type="button" style="flex-shrink: 0; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.edge}}; background: {{c.fill}}; color: {{c.ink}}; font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column">
    <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #A39D94; margin-bottom: 8px">This weekend</span>
    <sc-for list="{{events}}" as="e" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #403D3A">
        <span style="width: 48px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 0">
          <span style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #A39D94">{{e.dow}}</span>
          <span style="font-size: 22px; font-weight: 800">{{e.day}}</span>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-size: 18px; font-weight: 700">{{e.name}}</span>
          <span style="font-size: 14px; color: #A39D94">{{e.meta}}</span>
          <span style="font-size: 13px; color: #A39D94">Supported by <span style="color: #F4EEE2">{{e.sponsor}}</span></span>
        </div>
        <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Open</a>
      </div>
    </sc-for>
  </div>

  <div style="margin: 16px 20px 0; border: 1px solid #403D3A; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #A39D94">Recently wrapped</span>
      <span style="font-size: 16px; font-weight: 600">[EVENT TITLE]</span>
    </div>
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">See how it went</a>
  </div>

  <div style="margin-top: auto; padding: 16px 20px 22px; border-top: 1px solid #403D3A; display: flex; flex-direction: column; gap: 8px">
    <a href="#" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #7E7871; background: #232120; color: #F4EEE2; font-size: 16px; font-weight: 600; text-decoration: none">Host a gathering</a>
    <span style="font-size: 13px; color: #A39D94; text-align: center">Never who, only how many.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var off = { edge: '#7E7871', fill: 'transparent', ink: '#F4EEE2' };
    var on = { edge: '#3D9BFF', fill: 'rgba(61,155,255,0.14)', ink: '#8AC2FF' };
    return {
      chips: [
        Object.assign({ label: 'This weekend' }, on),
        Object.assign({ label: 'This month' }, off),
        Object.assign({ label: 'Next 90 days' }, off)
      ],
      events: [
        { dow: 'Fri', day: '23', name: '[EVENT TITLE]', meta: '7:00 PM · [VENUE NAME]', sponsor: '[SPONSOR NAME]' },
        { dow: 'Sat', day: '24', name: '[EVENT TITLE]', meta: '2:00 PM · [VENUE NAME]', sponsor: '[SPONSOR NAME]' },
        { dow: 'Sat', day: '24', name: '[EVENT TITLE]', meta: '7:00 PM · [VENUE NAME]', sponsor: '[SPONSOR NAME]' }
      ]
    };
  }
}
</script>
</body>
</html>
