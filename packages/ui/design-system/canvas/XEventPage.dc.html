<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experiment: OSE event page on the ourSharedMosaics ground</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1A1918;color:#F4EEE2;-webkit-font-smoothing:antialiased}
a{color:#3D9BFF}a:hover{color:#8AC2FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1A1918; color: #F4EEE2; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 10px 20px; border-bottom: 1px solid #403D3A; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: #A39D94">
    <span style="text-transform: uppercase; letter-spacing: 0.08em">Supported by</span>
    <span style="color: #F4EEE2; font-weight: 600">[SPONSOR NAME]</span>
  </div>

  <div style="padding: 24px 20px 18px; text-align: center; border-bottom: 1px solid #403D3A; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <span style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #A39D94">OurSharedEvents</span>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800">Friday game night</h1>
    <span style="font-size: 16px; color: #F4EEE2">Friday, October 23 · 6:00 PM</span>
    <span style="font-size: 13px; color: #A39D94">Hosted by [HOST] · verified event link</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 10px; border-radius: 999px; color: #00C4B4; background: rgba(0,196,180,0.15)">Live now</span>
  </div>

  

  <div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="min-height: 56px; border: none; border-radius: 8px; background: #3D9BFF; color: #1A1918; font: 800 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Check in</button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="min-height: 48px; border: 1px solid #7E7871; border-radius: 8px; background: #232120; color: #F4EEE2; font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Share</button>
      <button type="button" style="min-height: 48px; border: 1px solid #7E7871; border-radius: 8px; background: #232120; color: #F4EEE2; font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Add to calendar</button>
    </div>
  </div>

  <div style="margin-top: auto; padding: 14px 20px 20px; border-top: 1px solid #403D3A; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center">
    <span style="font-size: 16px; font-weight: 700">We count the room, never the person.</span>
    <span style="font-size: 13px; color: #A39D94">No account or name needed.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
