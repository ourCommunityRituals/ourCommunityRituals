# OCR monorepo-adjacent workspace.
#
# This root exists to host SHARED packages (packages/*) that bind Brain
# contracts to runtime code. Sibling app repos (ourSharedEvents, ourWKRP,
# etc.) remain standalone — they are NOT members of this workspace and keep
# their own lockfiles and CI. An app repo consumes a shared package via the
# normal npm install path (file:, workspace:, or a published version), not
# by virtue of living in this tree.
#
# Rule: only reusable, Brain-contract-bound packages live under packages/.
# App-specific code does not.
#
# Supply-chain policy findings on this file (semgrep pnpm-trust-policy,
# pnpm-minimum-release-age, pnpm-block-exotic-sub-dependencies) are suppressed
# on the `packages:` line below rather than "fixed" with config. Real
# enforcement needs pnpm >= 10.16 (minimumReleaseAge) plus an audited
# onlyBuiltDependencies allowlist; cargo-culting those keys onto the pinned
# pnpm@9.15.0 would be a no-op that only LOOKS hardened. Tracked as real work
# under OSE-1089 (pnpm upgrade + dependency-trust audit).
packages: # nosemgrep — supply-chain policy tracked under OSE-1089 (needs pnpm>=10.16)
  - 'packages/*'
